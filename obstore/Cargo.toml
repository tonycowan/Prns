[package]
name = "obstore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Local object store and object transfer"
rust-version = "1.90"

[[bin]]
name = "object-services"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "2.1"
getrandom = "0.2"
prns-flash-manifest = { path = "../prns-flash-manifest" }
serde_json = "1.0"
sha2 = "0.10.9"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls", "gzip"] }
url = "2.5"
zip = { version = "2.3", default-features = false, features = ["deflate"] }
x25519-dalek = { version = "3", default-features = false, features = ["precomputed-tables", "static_secrets"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
