[package]
name = "object-store-browser"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Desktop browser for a local object store"
rust-version = "1.90"

[workspace]

[dependencies]
dioxus = { version = "=0.7.5", features = ["desktop"] }
obstore = { path = ".." }
rfd = "0.15"
tokio = { version = "1", features = ["rt"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
