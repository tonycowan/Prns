[package]
name = "personal-text-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Minimal Dioxus LocalClient: joins Hopspot's shared RNS instance and announces lxmf.delivery (never hosts)."

# Own workspace so Dioxus stays off the suite no_std / lock gates.
[workspace]

[[bin]]
name = "personal-text-client"
path = "src/main.rs"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "live"]
mobile = ["dioxus/mobile", "live"]
live = ["dep:personal-rns", "dep:tokio", "dep:rmp", "dep:rmpv"]

[dependencies]
dioxus = { version = "=0.7.5", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

personal-rns = { path = "../../../personal-rns", optional = true, default-features = false, features = [
    "tokio-host",
    "shared-instance",
    "log",
] }
tokio = { version = "1", optional = true, default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
rmp = { version = "0.8", optional = true }
rmpv = { version = "1.3", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "console"] }

[profile.release]
lto = true
codegen-units = 1
