[package]
name = "personal-hopspot-dioxus-android"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Dioxus management UI for Personal Hopspot: mock web preview, live via Hopspot PrnsService WebView bridge."

# Own workspace so the Dioxus dep tree stays out of the suite lockfile / no_std gate.
[workspace]

[[bin]]
name = "personal-hopspot-dioxus-android"
path = "src/main.rs"

[features]
default = ["web"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[dependencies]
# Pinned to match the locally installed `dx` 0.7.5 used elsewhere in the suite.
dioxus = { version = "=0.7.5", features = ["router"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "console"] }

[profile.release]
lto = true
codegen-units = 1
