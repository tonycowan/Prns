[application]
name = "PRNSController"
default_platform = "desktop"
android_min_sdk_version = 30
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"

[web.app]
title = "PRNS Controller"

[bundle]
identifier = "org.personal.prns.controller"
publisher = "Personal PRNS"
short_description = "PRNS Controller for Personal Hopspot"
icon = [
    "assets/icon-32.png",
    "assets/icon-128.png",
    "assets/icon-256.png",
    "assets/icon-512.png",
    "assets/icon-1024.png",
]

[ios]
background_modes = ["bluetooth-central", "bluetooth-peripheral"]

[ios.raw]
info_plist = """
<key>CFBundleDisplayName</key>
<string>PRNS Controller</string>
<key>NSBluetoothAlwaysUsageDescription</key>
<string>PRNS Controller uses Bluetooth to reach nearby Hopspot devices.</string>
<key>NSBluetoothPeripheralUsageDescription</key>
<string>PRNS Controller uses Bluetooth to reach nearby Hopspot devices.</string>
<key>NSLocalNetworkUsageDescription</key>
<string>PRNS Controller uses your local Wi-Fi network to reach nearby Hopspot devices.</string>
<key>NSBonjourServices</key>
<array>
    <string>_reticulum._tcp</string>
    <string>_reticulum._udp</string>
    <string>_prns._tcp</string>
</array>
<key>UIApplicationSceneManifest</key>
<dict>
    <key>UIApplicationSupportsMultipleScenes</key>
    <false/>
    <key>UISceneConfigurations</key>
    <dict>
        <key>UIWindowSceneSessionRoleApplication</key>
        <array>
            <dict>
                <key>UISceneConfigurationName</key>
                <string>Default Configuration</string>
                <key>UISceneDelegateClassName</key>
                <string>PrnsControllerSceneDelegate</string>
            </dict>
        </array>
    </dict>
</dict>
"""

[android]
min_sdk = 30

[android.raw]
manifest = """
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
"""
