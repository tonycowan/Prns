[application]
name = "Awill"
default_platform = "desktop"
android_min_sdk_version = 30
android_main_activity = "android/MainActivity.kt"

[web.app]
title = "Awill"

[bundle]
identifier = "org.personal.prns.comms"
publisher = "Personal PRNS"
short_description = "Where there's a will there's a way"

[android]
min_sdk = 30
gradle_dependencies = [
    "androidx.camera:camera-core:1.4.2",
    "androidx.camera:camera-camera2:1.4.2",
    "androidx.camera:camera-lifecycle:1.4.2",
    "androidx.camera:camera-view:1.4.2",
]

[android.raw]
manifest = """
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-feature android:name="android.hardware.microphone" android:required="false" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
    <uses-feature android:name="android.hardware.usb.host" android:required="false" />
    <uses-feature android:name="android.hardware.usb.accessory" android:required="false" />
    <queries>
        <intent>
            <action android:name="android.media.action.IMAGE_CAPTURE" />
        </intent>
    </queries>
"""
